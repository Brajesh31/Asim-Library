name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown, local links, images and fenced blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []
          markdown = list(Path('.').rglob('*.md'))
          for path in markdown:
              if '.git' in path.parts or 'build' in path.parts:
                  continue
              content = path.read_text(encoding='utf-8')
              if not content.strip():
                  errors.append(f'{path}: empty Markdown file')
              refs = re.findall(r'!\[[^\]]*\]\(([^)]+)\)', content)
              refs += re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)', content, re.I)
              for ref in refs:
                  if ref.startswith(('http://', 'https://', 'data:')):
                      continue
                  clean = ref.split('#', 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      errors.append(f'{path}: missing asset {ref}')
              links = re.findall(r'(?<!!)\[[^\]]+\]\(([^)]+)\)', content)
              for ref in links:
                  if ref.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  clean = ref.split('#', 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      errors.append(f'{path}: missing link {ref}')
              fences = re.findall(r'^(`{3,}|~{3,})', content, re.M)
              if len(fences) % 2:
                  errors.append(f'{path}: unclosed fenced code block')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(markdown)} Markdown files and local references.')
          PY
