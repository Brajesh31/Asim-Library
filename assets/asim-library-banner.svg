<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="t d">
<title id="t">Asim-Library C++ data structures</title>
<desc id="d">A modern educational illustration showing a stack, a binary search tree, and an AVL tree.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09172e"/><stop offset="1" stop-color="#1c315b"/></linearGradient><linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.title{font:800 48px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 22px Inter,Arial,sans-serif;fill:#cbd5e1}.head{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}.small{font:500 15px Inter,Arial,sans-serif;fill:#cbd5e1}.node{fill:#17345a;stroke:#67e8f9;stroke-width:2.5}.line{stroke:url(#accent);stroke-width:4;fill:none;stroke-linecap:round}</style></defs>
